openapi: 3.0.0
info:
  title: Task Management API
  version: 1.0.0
  description: REST API for managing projects, tasks, and categories
  contact:
    name: API Support
    email: support@taskmanagement.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://your-render-url.onrender.com
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT token as "Bearer <token>"

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        username:
          type: string
          example: "john_doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Website Redesign"
        description:
          type: string
          example: "Complete overhaul of company website"
        ownerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "Design homepage"
        description:
          type: string
          example: "Create Figma designs"
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED]
          example: "IN_PROGRESS"
        dueDate:
          type: string
          format: date-time
          example: "2024-12-15T00:00:00.000Z"
        projectId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Development"
        ownerId:
          type: string
          format: uuid

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Error message here"

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      description: Check if the server is running
      security: []
      tags:
        - System
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  message:
                    type: string
                    example: "Server is running"

  /:
    get:
      summary: API Information
      description: Get API information and available endpoints
      security: []
      tags:
        - System
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  version:
                    type: string
                  documentation:
                    type: string
                  health:
                    type: string

  /api/auth/signup:
    post:
      summary: Register a new user
      description: Create a new user account
      security: []
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: "john_doe"
                  description: "Unique username"
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                  description: "Valid email address"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "Password123!"
                  description: "Password must be at least 8 characters"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User created successfully"
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      summary: Login to the application
      description: Authenticate user and receive JWT token
      security: []
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  format: password
                  example: "Password123!"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login successful"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIs..."
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects:
    post:
      summary: Create a new project
      description: Create a project for the authenticated user
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "New Project"
                description:
                  type: string
                  example: "Project description here"
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Missing required fields
        '401':
          description: Unauthorized - JWT token required

    get:
      summary: Get all projects
      description: Get all projects owned by the authenticated user
      tags:
        - Projects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized - JWT token required

  /api/projects/{id}:
    get:
      summary: Get project by ID
      description: Get a specific project by its ID (must be owner)
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project ID
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the owner
        '404':
          description: Project not found

    put:
      summary: Update a project
      description: Update a specific project (must be owner)
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Updated Project Name"
                description:
                  type: string
                  example: "Updated description"
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the owner
        '404':
          description: Project not found

    delete:
      summary: Delete a project
      description: Delete a specific project (must be owner)
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Project deleted successfully"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the owner
        '404':
          description: Project not found

  /api/tasks:
    post:
      summary: Create a new task
      description: Create a task under a specific project
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - projectId
              properties:
                title:
                  type: string
                  example: "Complete documentation"
                description:
                  type: string
                  example: "Write API documentation"
                status:
                  type: string
                  enum: [PENDING, IN_PROGRESS, COMPLETED]
                  example: "PENDING"
                dueDate:
                  type: string
                  format: date-time
                  example: "2024-12-31T23:59:59.000Z"
                projectId:
                  type: string
                  format: uuid
                  example: "project-id-here"
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Missing required fields
        '401':
          description: Unauthorized
        '404':
          description: Project not found

    get:
      summary: Get all tasks
      description: Get all tasks for the authenticated user with optional filters
      tags:
        - Tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, IN_PROGRESS, COMPLETED]
          description: Filter by task status
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by project ID
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized

  /api/tasks/{id}:
    get:
      summary: Get task by ID
      description: Get a specific task by its ID (must be owner)
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the owner
        '404':
          description: Task not found

    put:
      summary: Update a task
      description: Update a specific task (must be owner)
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [PENDING, IN_PROGRESS, COMPLETED]
                dueDate:
                  type: string
                  format: date-time
                projectId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the owner
        '404':
          description: Task not found

    delete:
      summary: Delete a task
      description: Delete a specific task (must be owner)
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Task deleted successfully"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the owner
        '404':
          description: Task not found

  /api/categories:
    post:
      summary: Create a new category
      description: Create a category for organizing tasks
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Development"
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Missing name field
        '401':
          description: Unauthorized
        '409':
          description: Category with this name already exists

    get:
      summary: Get all categories
      description: Get all categories for the authenticated user
      tags:
        - Categories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          description: Unauthorized

  /api/categories/{id}:
    get:
      summary: Get category by ID
      description: Get a specific category by its ID (must be owner)
      tags:
        - Categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the owner
        '404':
          description: Category not found

    put:
      summary: Update a category
      description: Update a specific category (must be owner)
      tags:
        - Categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Updated Category Name"
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Missing name field
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the owner
        '404':
          description: Category not found
        '409':
          description: Category with this name already exists

    delete:
      summary: Delete a category
      description: Delete a specific category (must be owner)
      tags:
        - Categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Category deleted successfully"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the owner
        '404':
          description: Category not found

  /api/tasks/{taskId}/categories/{categoryId}:
    post:
      summary: Add category to task
      description: Associate a category with a task
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Category added to task successfully"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the owner
        '404':
          description: Task or category not found

    delete:
      summary: Remove category from task
      description: Remove association between a category and a task
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Category removed from task successfully"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not the owner
        '404':
          description: Task, category, or association not found