services:
  - type: web
    name: task-management-api
    runtime: node
    repo: https://github.com/silyas-uncc/task-management-api.git
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

databases:
  - name: task-management-db
    databaseName: task_management
    user: task_user
    plan: free